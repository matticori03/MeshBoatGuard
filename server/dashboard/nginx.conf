server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Disabilita cache aggressiva per sviluppo/aggiornamenti rapidi
    add_header Cache-Control "no-cache, must-revalidate";

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy trasparente verso InfluxDB v2 (nessuna password richiesta al client/browser)
    location /api/query {
        proxy_pass http://influxdb:8086/api/v2/query?org=meshboatguard;
        proxy_http_version 1.1;
        proxy_set_header Authorization "Token meshboatguard_secret_token_12345";
        proxy_set_header Content-Type "application/vnd.flux";
        proxy_set_header Accept "application/csv";
        proxy_set_header Host $host;
    }

    # Proxy trasparente verso Node-RED per invio comandi (/arm, /disarm, /status, test)
    location /api/command {
        proxy_pass http://nodered:1880/api/command;
        proxy_http_version 1.1;
        proxy_set_header Content-Type "application/json";
        proxy_set_header Host $host;
    }
}

