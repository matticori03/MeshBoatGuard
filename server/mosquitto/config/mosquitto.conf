per_listener_settings true

# Internal listener: reachable only by containers on the Docker Compose network
# (Node-RED). It is not published on the host, so anonymous access here does not
# expose anything to the outside world.
listener 1883
allow_anonymous true

# External listener: published on the host/LAN for the physical Meshtastic gateway
# node. Authenticated because ARM/DISARM commands can be sent to the boat from here:
# see server/README_SERVER.md to generate the password file.
listener 1884 0.0.0.0
allow_anonymous false
password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
