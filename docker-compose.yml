services:
  # ---------------------------------------------------------------------------
  # MQTT BROKER: Self-hosted Mosquitto for Meshtastic uplink/downlink data
  # ---------------------------------------------------------------------------
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: meshboatguard_mosquitto
    restart: unless-stopped
    ports:
      # Only the authenticated listener (1884) is exposed on the host/LAN, for the
      # physical Meshtastic gateway node. Node-RED connects internally on the
      # Docker network to the anonymous listener 1883, never published outside.
      - "1884:1884"
    volumes:
      - ./server/mosquitto/config:/mosquitto/config
      - ./server/mosquitto/data:/mosquitto/data
      - ./server/mosquitto/log:/mosquitto/log

  # ---------------------------------------------------------------------------
  # 1. NODE-RED: Alarm logic orchestrator, Telegram Bot and DB writer
  # ---------------------------------------------------------------------------
  nodered:
    build: ./server/nodered
    image: meshboatguard/node-red:latest
    container_name: meshboatguard_nodered
    restart: unless-stopped
    ports:
      - "1880:1880"
    environment:
      - TZ=Europe/Rome
      # Meshtastic downlink topic for sending commands (/arm /disarm /status).
      # Format: msh/<region>/2/json/mqtt/!<hex_id_gateway_node>
      # Set this in .env with the values of your ground gateway node.
      - MESHTASTIC_MQTT_DOWNLINK_TOPIC=${MESHTASTIC_MQTT_DOWNLINK_TOPIC:-}
      # Default Telegram Chat ID for alarm push notifications (it is not a
      # response to a command, so a fixed recipient is needed). It can be obtained
      # by writing to the bot and reading the chat_id from the first received message.
      - TELEGRAM_DEFAULT_CHAT_ID=${TELEGRAM_DEFAULT_CHAT_ID:-}
    volumes:
      # A single bind: flows.json lives inside data/ and is versioned (see
      # .gitignore). Mounting the single file inside /data as well creates a nested
      # bind, which Docker Desktop refuses.
      - ./server/nodered/data:/data
    depends_on:
      - influxdb
      - mosquitto

  # ---------------------------------------------------------------------------
  # 2. INFLUXDB v2: Time series database (telemetry, access/alarm logs)
  # ---------------------------------------------------------------------------
  influxdb:
    image: influxdb:2.7
    container_name: meshboatguard_influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=meshboatguard123
      - DOCKER_INFLUXDB_INIT_ORG=meshboatguard
      - DOCKER_INFLUXDB_INIT_BUCKET=telemetry
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=meshboatguard_secret_token_12345
    volumes:
      - ./server/influxdb/data:/var/lib/influxdb2
      - ./server/influxdb/config:/etc/influxdb2

  # ---------------------------------------------------------------------------
  # 3. GRAFANA: Real-time monitoring and historical analysis dashboard
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: meshboatguard_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./server/grafana/data:/var/lib/grafana
      - ./server/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - influxdb
